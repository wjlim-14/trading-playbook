<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.Tradebook — Trading OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=18">
  <link rel="stylesheet" href="css/layout.css?v=18">
  <link rel="stylesheet" href="css/components.css?v=18">
</head>
<body>

  <div class="shell">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sb-brand">
      <div class="sb-title">J.TRADEBOOK</div>
      <div class="sb-sub">Trading OS · V2</div>
    </div>

    <!-- Account switcher -->
    <div class="sb-acct">
      <div class="sb-acct-label">Active Account</div>
      <select class="sb-acct-select" id="acct-switch" onchange="setActiveAccount(this.value)"></select>
      <div class="sb-acct-bal" id="acct-switch-bal">—</div>
    </div>

    <!-- Mode toggle -->
    <div class="sb-mode">
      <button class="sb-mode-btn active" id="btn-live" onclick="setMode('LIVE')">⚡ LIVE</button>
      <button class="sb-mode-btn" id="btn-backtest" onclick="setMode('BACKTEST')">🧪 BACKTEST</button>
    </div>

    <div class="sb-nav">
      <div class="sb-sec">Core</div>
      <div class="nav-item" data-page="p-dashboard" onclick="nav('p-dashboard')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
      <div class="nav-item" data-page="p-calculator" onclick="nav('p-calculator')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
        Calculator
      </div>
      <div class="nav-item" data-page="p-holdings" onclick="nav('p-holdings')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Holdings<span class="nav-badge" id="badge-holdings" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="p-journal" onclick="nav('p-journal')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Journal<span class="nav-badge" id="badge-journal" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="p-mindset" onclick="nav('p-mindset')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
        Mindset
      </div>

      <div class="sb-sec">Management</div>
      <div class="nav-item" data-page="p-accounts" onclick="nav('p-accounts')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Accounts
      </div>
      <div class="nav-item" data-page="p-backtest" onclick="nav('p-backtest')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6l-5 9a2 2 0 0 0 1.8 3h12.4a2 2 0 0 0 1.8-3l-5-9V2"/><line x1="9" y1="2" x2="15" y2="2"/><line x1="7" y1="16" x2="17" y2="16"/></svg>
        Backtest Journal
      </div>
      <div class="nav-item" data-page="p-settings" onclick="nav('p-settings')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </div>
    </div>

    <div class="sb-foot">
      <div class="heat-label">Portfolio Heat</div>
      <div class="heat-bar"><div class="heat-fill" id="sb-heat-fill"></div></div>
      <div class="heat-val" id="sb-heat-val">Open Risk: <span>—</span></div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
        <button onclick="_refreshData()" id="sb-refresh-btn" title="Refresh" style="display:flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid rgba(100,60,20,0.2);border-radius:var(--radius-sm);background:transparent;color:var(--sb-text);font-size:11px;cursor:pointer;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
        <span id="sb-last-updated" style="font-size:10px;color:var(--sb-text);opacity:0.5;font-family:var(--mono);">—</span>
      </div>
    </div>
  </nav>
  <div class="sb-backdrop" id="sb-backdrop" onclick="closeSidebar()"></div>

  <!-- Main -->
  <main id="main">
    <header class="topbar">
      <div class="topbar-l">
        <button class="hamburger" onclick="openSidebar()" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="mock-badge" id="mock-badge">🧪 BACKTEST</div>
      </div>
      <div class="topbar-r">
        <div class="heat-badge" id="topbar-heat"><div class="dot"></div><span id="topbar-heat-txt">—</span></div>
        <button class="btn btn-gold btn-sm" onclick="nav('p-calculator')">+ New Trade</button>
      </div>
    </header>

    <div class="content">
      <div class="page" id="p-dashboard"></div>
      <div class="page" id="p-calculator"></div>
      <div class="page" id="p-holdings"></div>
      <div class="page" id="p-journal"></div>
      <div class="page" id="p-mindset"></div>
      <div class="page" id="p-accounts"></div>
      <div class="page" id="p-backtest"></div>
      <div class="page" id="p-settings"></div>
    </div>
  </main>

  </div><!-- /.shell -->

  <!-- Mobile bottom nav -->
  <nav id="mobile-nav">
    <div class="mobile-nav-inner">
      <div class="mobile-tab" data-page="p-dashboard" onclick="nav('p-dashboard')">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dash</span>
      </div>
      <div class="mobile-tab" data-page="p-calculator" onclick="nav('p-calculator')">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/></svg>
        <span>Calc</span>
      </div>
      <div class="mobile-tab" data-page="p-holdings" onclick="nav('p-holdings')">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Holdings</span>
      </div>
      <div class="mobile-tab" data-page="p-journal" onclick="nav('p-journal')">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Journal</span>
      </div>
    </div>
  </nav>

  <!-- Modal + toast mount points -->
  <div id="modal-root"></div>
  <div id="toast-wrap"></div>

  <!-- Loader -->
  <div id="app-loader" style="position:fixed;inset:0;background:#f0ebe2;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:12px;">
    <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#1c1108;">J.Tradebook</div>
    <div style="font-size:13px;color:#7a6550;">Loading your data...</div>
  </div>

  <!-- Scripts — load order matters -->
  <script src="js/data.js?v=18"></script>
  <script src="js/utils.js?v=18"></script>
  <script src="js/charts.js?v=18"></script>
  <script src="js/ui.js?v=18"></script>
  <script src="js/router.js?v=18"></script>
  <script src="pages/dashboard.js?v=18"></script>
  <script src="pages/calculator.js?v=18"></script>
  <script src="pages/holdings.js?v=18"></script>
  <script src="pages/journal.js?v=18"></script>
  <script src="pages/mindset.js?v=18"></script>
  <script src="pages/accounts.js?v=18"></script>
  <script src="pages/backtest.js?v=18"></script>
  <script src="pages/settings.js?v=18"></script>
  <script src="js/app.js?v=18"></script>

</body>
</html>
